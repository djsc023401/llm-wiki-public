name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_wiki_test
          POSTGRES_USER: llm_wiki
          POSTGRES_PASSWORD: llm_wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_wiki -d llm_wiki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql://llm_wiki:llm_wiki@localhost:5432/llm_wiki_test
      LLM_WIKI_ALLOW_DESTRUCTIVE_TESTS: "1"
      APP_BASE_URL: http://127.0.0.1:8080
      S3_BUCKET: llm-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public snapshot gate
        run: python scripts/publication_gate.py --skip-compile --skip-pytest --secret-tools=skip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -f src
      - name: Test
        run: python -m pytest
