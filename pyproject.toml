[project]
name = "llm-wiki"
version = "0.1.0"
description = "Server-side API, worker, and tooling for llm-wiki"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3==1.35.99",
  "fastapi==0.115.6",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "openai==2.40.0",
  "psycopg[binary]==3.2.3",
  "pywebpush==2.0.3",
  "python-multipart==0.0.20",
  "requests==2.32.3",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_wiki = ["migrations/*.sql", "static/*.css", "static/*.js"]
